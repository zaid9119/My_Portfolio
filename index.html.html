<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">

<title>ZAID RAZA — Visual Designer</title>

<meta name="description"
content="Md Zaid Raza — Thumbnail Designer, Graphic Designer and Visual Content Creator.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>

/* =========================================================
   RESET
========================================================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    background:#f4f3ef;
    color:#111;
    font-family:"DM Sans",sans-serif;
    overflow-x:hidden;
}

img{
    max-width:100%;
    display:block;
}

button,
input,
textarea{
    font:inherit;
}

button{
    cursor:pointer;
}

a{
    color:inherit;
    text-decoration:none;
}

::selection{
    background:#111;
    color:#fff;
}

h1,h2,h3,h4{
    font-family:"Space Grotesk",sans-serif;
}

/* =========================================================
   VARIABLES
========================================================= */

:root{
    --bg:#f4f3ef;
    --card:#ebeae5;
    --black:#111;
    --muted:#6d6d68;
    --line:#d8d7d1;
    --accent:#111;
    --radius:28px;
}

/* =========================================================
   LOADER
========================================================= */

.loader{
    position:fixed;
    inset:0;
    background:#111;
    color:#fff;
    z-index:99999;
    display:flex;
    align-items:center;
    justify-content:center;
    transition:.6s;
}

.loader.hide{
    opacity:0;
    visibility:hidden;
}

.loader-inner{
    text-align:center;
}

.loader-logo{
    font-family:"Space Grotesk";
    font-size:clamp(3rem,12vw,8rem);
    font-weight:700;
    letter-spacing:-.08em;
}

.loader-line{
    width:160px;
    height:3px;
    background:#333;
    margin:25px auto;
    overflow:hidden;
}

.loader-line span{
    display:block;
    height:100%;
    width:50%;
    background:white;
    animation:loading 1s infinite;
}

@keyframes loading{
    from{transform:translateX(-100%)}
    to{transform:translateX(300%)}
}

/* =========================================================
   CUSTOM CURSOR
========================================================= */

.cursor{
    position:fixed;
    width:12px;
    height:12px;
    background:#111;
    border-radius:50%;
    pointer-events:none;
    z-index:99998;
    transform:translate(-50%,-50%);
    transition:
        width .2s,
        height .2s,
        background .2s;
}

.cursor.big{
    width:50px;
    height:50px;
    background:#111;
    mix-blend-mode:difference;
}

@media(max-width:800px){
    .cursor{
        display:none;
    }
}

/* =========================================================
   NAVBAR
========================================================= */

.nav{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    z-index:9000;
    transition:.35s;
}

.nav.scrolled{
    background:rgba(244,243,239,.88);
    backdrop-filter:blur(20px);
    border-bottom:1px solid var(--line);
}

.nav-inner{
    max-width:1400px;
    margin:auto;
    padding:20px 28px;
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.logo{
    font-family:"Space Grotesk";
    font-weight:700;
    font-size:20px;
    letter-spacing:-.04em;
}

.logo span{
    color:#999;
}

.nav-links{
    display:flex;
    gap:35px;
    font-size:14px;
    font-weight:600;
}

.nav-links a{
    position:relative;
}

.nav-links a:after{
    content:"";
    position:absolute;
    bottom:-6px;
    left:0;
    width:0;
    height:1px;
    background:#111;
    transition:.3s;
}

.nav-links a:hover:after{
    width:100%;
}

.nav-contact{
    border:1px solid #111;
    padding:11px 19px;
    border-radius:999px;
    font-size:13px;
    font-weight:700;
    transition:.25s;
}

.nav-contact:hover{
    background:#111;
    color:#fff;
}

.mobile-menu{
    display:none;
    width:44px;
    height:44px;
    border:1px solid #111;
    border-radius:50%;
    background:transparent;
}

@media(max-width:800px){

    .nav-inner{
        padding:16px;
    }

    .nav-links,
    .nav-contact{
        display:none;
    }

    .mobile-menu{
        display:flex;
        align-items:center;
        justify-content:center;
    }
}

/* =========================================================
   MOBILE MENU
========================================================= */

.mobile-panel{
    position:fixed;
    inset:0;
    background:#111;
    color:#fff;
    z-index:8999;
    padding:100px 25px 30px;
    transform:translateY(-100%);
    transition:.5s;
}

.mobile-panel.open{
    transform:none;
}

.mobile-panel a{
    display:block;
    font-family:"Space Grotesk";
    font-size:48px;
    font-weight:700;
    padding:12px 0;
}

/* =========================================================
   HERO
========================================================= */

.hero{
    min-height:100svh;
    padding:150px 28px 90px;
    display:flex;
    align-items:center;

    background-image:
        linear-gradient(#deddd8 1px,transparent 1px),
        linear-gradient(90deg,#deddd8 1px,transparent 1px);

    background-size:80px 80px;
}

.hero-inner{
    width:100%;
    max-width:1400px;
    margin:auto;

    display:grid;
    grid-template-columns:1.15fr .85fr;
    gap:80px;
    align-items:center;
}

.eyebrow{
    font-size:11px;
    font-weight:700;
    letter-spacing:.28em;
    text-transform:uppercase;
    color:#666;
}

.hero h1{
    margin-top:25px;
    font-size:clamp(4rem,9.5vw,9.5rem);
    line-height:.78;
    letter-spacing:-.075em;
    max-width:950px;
}

.serif{
    font-family:Georgia,serif;
    font-style:italic;
    font-weight:400;
}

.hero-description{
    max-width:620px;
    margin-top:38px;
    font-size:18px;
    line-height:1.7;
    color:#65645f;
}

.hero-buttons{
    display:flex;
    flex-wrap:wrap;
    gap:12px;
    margin-top:30px;
}

.btn{
    border-radius:999px;
    padding:15px 24px;
    font-weight:700;
    border:1px solid #111;
    transition:.3s;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:8px;
}

.btn-black{
    background:#111;
    color:#fff;
}

.btn-black:hover{
    transform:translateY(-3px);
}

.btn-outline:hover{
    background:#111;
    color:#fff;
}

/* =========================================================
   HERO IMAGE
========================================================= */

.hero-visual{
    position:relative;
    max-width:500px;
    width:100%;
    margin-left:auto;
}

.profile-card{
    position:relative;
    aspect-ratio:4/5;
    border-radius:35px;
    overflow:hidden;
    background:
        radial-gradient(circle at 30% 20%,#fff,#b8b5ad 55%,#777 100%);
    box-shadow:0 35px 80px rgba(0,0,0,.16);
}

.profile-card img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.profile-placeholder{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:"Space Grotesk";
    font-size:clamp(6rem,15vw,12rem);
    font-weight:700;
    letter-spacing:-.1em;
    color:rgba(255,255,255,.72);
}

.profile-label{
    position:absolute;
    top:18px;
    left:18px;
    background:#fff;
    padding:11px 15px;
    font-size:10px;
    font-weight:800;
    border-radius:5px;
}

.available{
    position:absolute;
    bottom:18px;
    right:18px;
    background:#111;
    color:#fff;
    padding:11px 15px;
    font-size:10px;
    font-weight:800;
    border-radius:5px;
}

.circle-badge{
    position:absolute;
    width:125px;
    height:125px;
    bottom:-35px;
    left:-45px;
    border:1px solid #111;
    border-radius:50%;
    background:var(--bg);
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    font-size:10px;
    font-weight:800;
    line-height:1.4;
}

@media(max-width:900px){

    .hero{
        padding-top:125px;
    }

    .hero-inner{
        grid-template-columns:1fr;
        gap:55px;
    }

    .hero-visual{
        margin:auto;
    }
}

@media(max-width:600px){

    .hero{
        padding:115px 16px 70px;
        background-size:45px 45px;
    }

    .hero h1{
        font-size:17vw;
    }

    .hero-description{
        font-size:16px;
    }

    .circle-badge{
        width:95px;
        height:95px;
        left:-10px;
        bottom:-25px;
    }
}

/* =========================================================
   MARQUEE
========================================================= */

.marquee{
    margin:0 14px;
    overflow:hidden;
    background:#111;
    color:#fff;
    border-radius:28px;
    border:1px solid #111;
}

.marquee-track{
    display:flex;
    width:max-content;
    animation:marquee 25s linear infinite;
}

.marquee-content{
    white-space:nowrap;
    padding:20px 0;
    font-size:13px;
    font-weight:700;
    letter-spacing:.25em;
}

@keyframes marquee{
    to{
        transform:translateX(-50%);
    }
}

/* =========================================================
   SECTIONS
========================================================= */

.section{
    max-width:1400px;
    margin:auto;
    padding:130px 28px;
}

.section-header{
    display:flex;
    justify-content:space-between;
    align-items:end;
    gap:30px;
    margin-bottom:55px;
}

.section-label{
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:.25em;
    font-weight:700;
    color:#777;
}

.section-title{
    font-size:clamp(3rem,7vw,7rem);
    line-height:.9;
    letter-spacing:-.06em;
    margin-top:12px;
}

.section-note{
    max-width:330px;
    color:#777;
    font-size:14px;
    line-height:1.6;
}

/* =========================================================
   PROJECTS
========================================================= */

.project-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:22px;
}

.project{
    background:#ebeae5;
    border:1px solid rgba(0,0,0,.08);
    border-radius:30px;
    overflow:hidden;
    transition:.45s;
    cursor:pointer;
}

.project:hover{
    transform:translateY(-8px);
    box-shadow:0 30px 70px rgba(0,0,0,.12);
}

.project-image{
    aspect-ratio:16/10;
    overflow:hidden;
    background:#ddd;
}

.project-image img{
    width:100%;
    height:100%;
    object-fit:cover;
    transition:.7s;
}

.project:hover .project-image img{
    transform:scale(1.06);
}

.project-info{
    padding:22px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:20px;
}

.project-title{
    font-size:21px;
    font-weight:700;
}

.project-tag{
    font-size:10px;
    letter-spacing:.18em;
    color:#777;
    font-weight:800;
    margin-top:5px;
}

.project-arrow{
    width:42px;
    height:42px;
    border:1px solid #bbb;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
}

@media(max-width:700px){

    .section{
        padding:90px 16px;
    }

    .section-header{
        display:block;
    }

    .section-note{
        margin-top:20px;
    }

    .project-grid{
        grid-template-columns:1fr;
    }
}

/* =========================================================
   SERVICES
========================================================= */

.dark-section{
    background:#111;
    color:#fff;
    max-width:none;
}

.dark-section .section{
    max-width:1400px;
}

.services-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:15px;
}

.service{
    min-height:330px;
    padding:30px;
    border:1px solid rgba(255,255,255,.12);
    border-radius:30px;
    background:rgba(255,255,255,.035);
    transition:.35s;
}

.service:hover{
    background:rgba(255,255,255,.08);
    transform:translateY(-6px);
}

.service-number{
    color:#777;
    font-size:13px;
}

.service h3{
    font-size:30px;
    line-height:1;
    margin-top:90px;
}

.service p{
    color:#999;
    line-height:1.7;
    margin-top:18px;
}

@media(max-width:800px){

    .services-grid{
        grid-template-columns:1fr;
    }

    .service{
        min-height:auto;
    }

    .service h3{
        margin-top:55px;
    }
}

/* =========================================================
   ABOUT
========================================================= */

.about-grid{
    display:grid;
    grid-template-columns:.8fr 1.2fr;
    gap:100px;
    align-items:center;
}

.big-zr{
    font-family:"Space Grotesk";
    font-size:clamp(7rem,18vw,18rem);
    line-height:.7;
    letter-spacing:-.1em;
    font-weight:700;
}

.about-heading{
    font-size:clamp(2.8rem,6vw,6rem);
    line-height:.95;
    letter-spacing:-.06em;
}

.about-text{
    max-width:650px;
    margin-top:30px;
    color:#686761;
    font-size:17px;
    line-height:1.8;
}

.stats{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:20px;
    margin-top:45px;
    border-top:1px solid #ccc;
    padding-top:25px;
}

.stat-number{
    font-family:"Space Grotesk";
    font-size:42px;
    font-weight:700;
}

.stat-label{
    color:#777;
    font-size:10px;
    text-transform:uppercase;
    letter-spacing:.16em;
    margin-top:6px;
}

@media(max-width:800px){

    .about-grid{
        grid-template-columns:1fr;
        gap:70px;
    }

    .stats{
        grid-template-columns:1fr 1fr;
    }
}

/* =========================================================
   CONTACT
========================================================= */

.contact-section{
    background:#deddd6;
}

.contact-grid{
    max-width:1400px;
    margin:auto;
    padding:120px 28px;
    display:grid;
    grid-template-columns:.8fr 1.2fr;
    gap:100px;
}

.contact-title{
    font-size:clamp(3rem,7vw,7rem);
    line-height:.88;
    letter-spacing:-.065em;
    margin-top:18px;
}

.contact-form{
    display:grid;
    gap:13px;
}

.field{
    width:100%;
    border:1px solid #c8c6be;
    background:#ebeae5;
    border-radius:18px;
    padding:18px;
    outline:none;
    color:#111;
    transition:.25s;
}

.field:focus{
    border-color:#111;
    background:#f4f3ef;
}

textarea.field{
    resize:vertical;
    min-height:160px;
}

.form-button{
    border:none;
    border-radius:18px;
    padding:20px;
    background:#111;
    color:#fff;
    text-align:left;
    font-weight:800;
    transition:.3s;
}

.form-button:hover{
    transform:translateY(-3px);
}

@media(max-width:800px){

    .contact-grid{
        grid-template-columns:1fr;
        gap:60px;
        padding:90px 16px;
    }
}

/* =========================================================
   FOOTER
========================================================= */

.footer{
    background:#111;
    color:#fff;
    padding:45px 28px;
}

.footer-inner{
    max-width:1400px;
    margin:auto;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:20px;
}

.footer-logo{
    font-family:"Space Grotesk";
    font-weight:700;
    font-size:20px;
}

.footer-copy{
    color:#777;
    font-size:11px;
}

.socials{
    display:flex;
    gap:10px;
}

.social{
    border:1px solid #333;
    border-radius:50%;
    width:42px;
    height:42px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:11px;
    transition:.3s;
}

.social:hover{
    background:#fff;
    color:#111;
}

@media(max-width:700px){

    .footer-inner{
        flex-direction:column;
        align-items:flex-start;
    }
}

/* =========================================================
   PROJECT MODAL
========================================================= */

.modal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.92);
    z-index:15000;
    display:none;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.modal.open{
    display:flex;
}

.preview-box{
    width:min(1100px,100%);
    max-height:92vh;
    overflow:auto;
}

.preview-close{
    float:right;
    width:45px;
    height:45px;
    border:0;
    border-radius:50%;
    background:#fff;
    color:#111;
    font-size:22px;
    margin-bottom:15px;
}

.preview-image{
    width:100%;
    max-height:75vh;
    object-fit:contain;
    border-radius:20px;
}

.preview-title{
    color:#fff;
    font-family:"Space Grotesk";
    font-size:25px;
    font-weight:700;
    margin-top:18px;
}

/* =========================================================
   ADMIN LOGIN
========================================================= */

.admin-overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.94);
    z-index:20000;
    display:none;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.admin-overlay.open{
    display:flex;
}

.login-box{
    width:min(420px,100%);
    background:#151515;
    color:#fff;
    padding:35px;
    border-radius:30px;
    border:1px solid #333;
}

.admin-small{
    color:#777;
    text-transform:uppercase;
    font-size:10px;
    letter-spacing:.2em;
}

.login-title{
    font-size:42px;
    margin:8px 0 28px;
}

.admin-field{
    width:100%;
    background:#222;
    color:#fff;
    border:1px solid #333;
    padding:16px;
    border-radius:14px;
    outline:none;
    margin-bottom:10px;
}

.admin-field:focus{
    border-color:#777;
}

.admin-button{
    border:0;
    background:#fff;
    color:#111;
    padding:16px;
    border-radius:14px;
    width:100%;
    font-weight:800;
    margin-top:10px;
}

.close-admin{
    float:right;
    background:transparent;
    border:0;
    color:#fff;
    font-size:25px;
}

/* =========================================================
   ADMIN DASHBOARD
========================================================= */

.dashboard{
    position:fixed;
    inset:0;
    background:#0d0d0d;
    color:#fff;
    z-index:21000;
    display:none;
    overflow-y:auto;
}

.dashboard.open{
    display:block;
}

.dashboard-inner{
    max-width:1500px;
    margin:auto;
    padding:25px;
}

.dashboard-header{
    position:sticky;
    top:0;
    z-index:10;
    background:rgba(13,13,13,.9);
    backdrop-filter:blur(20px);
    border-bottom:1px solid #292929;
    padding:20px 0;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:20px;
}

.dashboard-title{
    font-family:"Space Grotesk";
    font-size:32px;
    font-weight:700;
}

.dashboard-subtitle{
    color:#777;
    font-size:11px;
    margin-top:3px;
}

.dashboard-actions{
    display:flex;
    gap:8px;
}

.dash-btn{
    border:1px solid #333;
    color:#fff;
    background:#181818;
    border-radius:999px;
    padding:11px 16px;
    font-size:11px;
    font-weight:700;
}

.dash-btn:hover{
    background:#fff;
    color:#111;
}

.dash-btn.danger{
    color:#ff7777;
}

.admin-layout{
    display:grid;
    grid-template-columns:230px 1fr;
    gap:25px;
    margin-top:25px;
}

.admin-sidebar{
    position:sticky;
    top:100px;
    height:max-content;
    display:grid;
    gap:5px;
}

.admin-tab{
    width:100%;
    border:0;
    background:transparent;
    color:#888;
    padding:14px 16px;
    border-radius:13px;
    text-align:left;
    font-weight:700;
}

.admin-tab:hover,
.admin-tab.active{
    color:#fff;
    background:#1c1c1c;
}

.admin-content{
    min-width:0;
}

.admin-panel{
    display:none;
    background:#151515;
    border:1px solid #272727;
    border-radius:28px;
    padding:30px;
}

.admin-panel.active{
    display:block;
}

.panel-title{
    font-family:"Space Grotesk";
    font-size:28px;
    margin-bottom:5px;
}

.panel-description{
    color:#777;
    font-size:13px;
    margin-bottom:25px;
}

.admin-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:15px;
}

.admin-group{
    margin-bottom:17px;
}

.admin-group.full{
    grid-column:1/-1;
}

.admin-label{
    display:block;
    color:#aaa;
