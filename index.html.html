<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#0b0b0b">
<title>ZAID RAZA — Graphic Designer</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">

<!-- Supabase Library -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
  --bg:#efece5;--card:#fffcf7;--text:#101010;--muted:#6e6b64;--line:#d6d1c6;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:"DM Sans",sans-serif;min-height:100vh}
a{color:inherit;text-decoration:none}
img{max-width:100%;display:block}

/* Force Loader Hide Class */
.loader{position:fixed;inset:0;z-index:99999;background:#0b0b0b;color:#fff;display:flex;align-items:center;justify-content:center;transition:opacity .5s ease, visibility .5s ease}
.loader.hide{opacity:0;visibility:hidden;pointer-events:none !important}
.loader-inner{text-align:center}
.loader-logo{font-family:"Space Grotesk",sans-serif;font-size:28px;font-weight:700;margin-bottom:12px}

.nav{position:fixed;top:0;left:0;width:100%;z-index:900;background:rgba(239,236,229,.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.nav-inner{max-width:1200px;margin:auto;padding:16px 20px;display:flex;align-items:center;justify-content:space-between}
.logo{font-family:"Space Grotesk",sans-serif;font-size:20px;font-weight:700;cursor:pointer}

.hero{padding:140px 20px 80px;max-width:1200px;margin:auto}
.eyebrow{text-transform:uppercase;letter-spacing:.2em;font-size:11px;font-weight:700;color:var(--muted)}
.hero-title{font-size:clamp(40px,7vw,90px);line-height:.95;margin:20px 0;font-family:"Space Grotesk",sans-serif}
.hero-desc{max-width:500px;color:var(--muted);font-size:16px;line-height:1.6}

.section{max-width:1200px;margin:auto;padding:60px 20px}
.section-title{font-size:36px;font-family:"Space Grotesk",sans-serif;margin-bottom:30px}
.work-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:20px}
.project-card{background:var(--card);border:1px solid var(--line);border-radius:20px;overflow:hidden;padding:15px}
.project-card img{width:100%;aspect-ratio:16/10;object-fit:cover;border-radius:12px;margin-bottom:12px}

.contact-form{display:grid;gap:12px;max-width:500px}
.field{width:100%;padding:14px;border:1px solid var(--line);border-radius:12px;background:#fff}
.btn-submit{background:#111;color:#fff;padding:14px;border:0;border-radius:12px;font-weight:700;cursor:pointer}

/* Admin Overlays */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:10000;display:none;align-items:center;justify-content:center;padding:20px}
.overlay.open{display:flex}
.modal{background:#fff;padding:30px;border-radius:20px;max-width:400px;width:100%}
</style>
</head>
<body>

<div class="loader" id="loader">
  <div class="loader-inner">
    <div class="loader-logo">ZAID/RAZA</div>
    <p style="font-size:12px;color:#888">Loading portfolio...</p>
  </div>
</div>

<nav class="nav">
  <div class="nav-inner">
    <div class="logo" id="logoClick">ZAID/RAZA</div>
    <div><a href="#contact" style="font-weight:700;font-size:14px">Contact ↗</a></div>
  </div>
</nav>

<main class="hero">
  <div class="eyebrow" id="eyebrowText">Graphic Designer · Visual Creator</div>
  <h1 class="hero-title" id="mainTitle">I MAKE<br>VISUALS MOVE.</h1>
  <p class="hero-desc" id="mainDesc">I turn ordinary ideas into bold, clear and high-impact visuals designed to grab attention.</p>
</main>

<section class="section" id="work">
  <h2 class="section-title">Selected Work</h2>
  <div class="work-grid" id="workGrid">
    <p style="color:#888">No projects uploaded yet.</p>
  </div>
</section>

<section class="section" id="contact">
  <h2 class="section-title">Let's Connect</h2>
  <form class="contact-form" action="https://formsubmit.co/mdzaidraza9119@gmail.com" method="POST">
    <input class="field" required name="name" placeholder="Your Name">
    <input class="field" required type="email" name="email" placeholder="Your Email">
    <textarea class="field" required name="message" rows="4" placeholder="Your Message"></textarea>
    <button class="btn-submit" type="submit">SEND MESSAGE</button>
  </form>
</section>

<div class="overlay" id="loginModal">
  <div class="modal">
    <h3>Admin Login</h3>
    <input class="field" id="userIn" placeholder="Username" style="margin:10px 0">
    <input class="field" id="passIn" type="password" placeholder="Password" style="margin-bottom:10px">
    <button class="btn-submit" style="width:100%" id="loginBtn">LOGIN</button>
  </div>
</div>

<script>
// FORCE REMOVE LOADER AFTER 1.5 SECONDS GUARANTEED
function removeLoader() {
  const loader = document.getElementById("loader");
  if(loader) {
    loader.classList.add("hide");
  }
}
setTimeout(removeLoader, 1500);
window.addEventListener("load", removeLoader);

// Supabase Safe Init
const SUPABASE_URL = "https://hngdqjqwffhcenffkscm.supabase.co";
const SUPABASE_KEY = "sb_publishable_uvMp_g9xsjEaoHZ-KyXx1g_KoMj8-qI";
let supabase = null;

try {
  if (window.supabase) {
    supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  }
} catch (e) {
  console.log("Supabase error:", e);
}

// Load Data
async function initData() {
  if (!supabase) return;
  try {
    const { data } = await supabase.from('portfolio_data').select('content').eq('id', 'main_config').single();
    if (data && data.content) {
      if(data.content.title) document.getElementById("mainTitle").innerHTML = data.content.title.replace(/\n/g, "<br>");
      if(data.content.description) document.getElementById("mainDesc").textContent = data.content.description;
    }
  } catch(e) {
    console.log("Data fetch skipped:", e);
  }
}
initData();

// Admin Trigger (Click logo 4 times)
let clicks = 0;
document.getElementById("logoClick").addEventListener("click", () => {
  clicks++;
  if(clicks >= 4) {
    clicks = 0;
    document.getElementById("loginModal").classList.add("open");
  }
});

document.getElementById("loginBtn").addEventListener("click", () => {
  const u = document.getElementById("userIn").value;
  const p = document.getElementById("passIn").value;
  if(u === "ZAIDX9119" && p === "Zaid@9119") {
    alert("Login successful!");
    document.getElementById("loginModal").classList.remove("open");
  } else {
    alert("Wrong Credentials");
  }
});
</script>
</body>
</html>
