<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ZAID/RAZA — Visual Designer</title>

<meta name="description" content="Md Zaid Raza — Thumbnail Designer & Visual Creator">

<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap');

:root{
  --bg:#f3f2ed;
  --surface:#e8e7e1;
  --surface2:#deddd6;
  --text:#111111;
  --muted:#6e6e68;
  --line:rgba(0,0,0,.12);
  --black:#111111;
  --white:#ffffff;
  --accent:#111111;
  --radius:28px;
  --buttonRadius:999px;
  --cardRadius:28px;
  --gridSize:70px;
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html{
  scroll-behavior:smooth;
}

body{
  background:var(--bg);
  color:var(--text);
  font-family:'DM Sans',sans-serif;
  overflow-x:hidden;
}

body.admin-open{
  overflow:hidden;
}

h1,h2,h3,h4,
.logo,
.display{
  font-family:'Space Grotesk',sans-serif;
}

a{
  color:inherit;
  text-decoration:none;
}

button,
input,
textarea,
select{
  font:inherit;
}

button{
  cursor:pointer;
}

::selection{
  background:#111;
  color:#fff;
}

/* =====================================
   LOADER
===================================== */

#loader{
  position:fixed;
  inset:0;
  z-index:99999;
  background:#111;
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  transition:opacity .6s,visibility .6s;
}

#loader.hide{
  opacity:0;
  visibility:hidden;
  pointer-events:none;
}

.loader-inner{
  text-align:center;
}

.loader-logo{
  font-family:'Space Grotesk';
  font-weight:700;
  font-size:22px;
  letter-spacing:-1px;
}

.loader-line{
  width:125px;
  height:2px;
  background:#444;
  margin:15px auto 0;
  overflow:hidden;
}

.loader-line span{
  display:block;
  width:40%;
  height:100%;
  background:white;
  animation:loading 1.1s infinite ease-in-out;
}

@keyframes loading{
  0%{transform:translateX(-120%)}
  100%{transform:translateX(350%)}
}

/* =====================================
   CURSOR
===================================== */

.cursor{
  position:fixed;
  width:11px;
  height:11px;
  border-radius:50%;
  background:#111;
  pointer-events:none;
  z-index:9998;
  transform:translate(-50%,-50%);
  transition:
    width .2s,
    height .2s,
    background .2s;
}

.cursor.big{
  width:45px;
  height:45px;
  background:#111;
  mix-blend-mode:difference;
}

@media(max-width:800px){
  .cursor{
    display:none;
  }
}

/* =====================================
   NAV
===================================== */

.nav{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  z-index:1000;
  transition:.35s;
}

.nav.scrolled{
  background:rgba(243,242,237,.88);
  backdrop-filter:blur(20px);
  border-bottom:1px solid var(--line);
}

.nav-inner{
  max-width:1400px;
  margin:auto;
  padding:20px 32px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.logo{
  font-weight:700;
  font-size:19px;
  letter-spacing:-.7px;
  cursor:pointer;
  user-select:none;
}

.logo span{
  color:#999;
}

.nav-links{
  display:flex;
  gap:36px;
  font-size:13px;
  font-weight:600;
}

.nav-links a{
  position:relative;
}

.nav-links a:after{
  content:"";
  position:absolute;
  left:0;
  bottom:-6px;
  width:0;
  height:1px;
  background:currentColor;
  transition:.3s;
}

.nav-links a:hover:after{
  width:100%;
}

.nav-talk{
  border:1px solid var(--text);
  padding:10px 18px;
  border-radius:var(--buttonRadius);
  font-size:13px;
  font-weight:700;
  transition:.3s;
}

.nav-talk:hover{
  background:var(--black);
  color:#fff;
}

@media(max-width:700px){
  .nav-inner{
    padding:17px 16px;
  }

  .nav-links{
    display:none;
  }

  .logo{
    font-size:16px;
  }

  .nav-talk{
    padding:8px 14px;
    font-size:11px;
  }
}

/* =====================================
   HERO
===================================== */

.hero{
  min-height:100vh;
  padding:150px 32px 100px;
  display:flex;
  align-items:center;

  background-image:
    linear-gradient(var(--line) 1px,transparent 1px),
    linear-gradient(90deg,var(--line) 1px,transparent 1px);

  background-size:
    var(--gridSize) var(--gridSize);
}

.hero-inner{
  max-width:1400px;
  width:100%;
  margin:auto;

  display:grid;
  grid-template-columns:1.15fr .85fr;
  gap:80px;
  align-items:center;
}

.eyebrow{
  font-size:11px;
  letter-spacing:.3em;
  text-transform:uppercase;
  font-weight:700;
  color:var(--muted);
}

.hero-title{
  margin-top:27px;
  font-size:clamp(62px,9.4vw,150px);
  line-height:.78;
  letter-spacing:-.075em;
  font-weight:700;
}

.italic{
  font-family:Georgia,serif;
  font-style:italic;
  font-weight:400;
}

.hero-description{
  max-width:570px;
  margin-top:38px;
  color:var(--muted);
  font-size:17px;
  line-height:1.8;
}

.hero-buttons{
  display:flex;
  flex-wrap:wrap;
  gap:12px;
  margin-top:30px;
}

.btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  padding:15px 24px;
  border-radius:var(--buttonRadius);
  font-weight:700;
  font-size:14px;
  transition:
    transform .3s,
    background .3s,
    color .3s;
}

.btn:hover{
  transform:translateY(-3px);
}

.btn-black{
  background:#111;
  color:#fff;
}

.btn-outline{
  border:1px solid #111;
}

.btn-outline:hover{
  background:#111;
  color:#fff;
}

/* =====================================
   PROFILE
===================================== */

.hero-profile{
  position:relative;
  max-width:470px;
  width:100%;
  margin-left:auto;
}

.profile-card{
  aspect-ratio:4/5;
  overflow:hidden;
  border-radius:var(--cardRadius);
  background:
    linear-gradient(135deg,#d9d7d0,#98968f);
  position:relative;
  box-shadow:0 30px 70px rgba(0,0,0,.14);
}

.profile-card img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
  filter:grayscale(100%);
}

.profile-placeholder{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  color:rgba(255,255,255,.7);
  font-family:'Space Grotesk';
  font-size:clamp(90px,12vw,180px);
  font-weight:700;
  letter-spacing:-.1em;
}

.profile-top{
  position:absolute;
  left:18px;
  top:18px;
  background:#fff;
  padding:9px 13px;
  border-radius:4px;
  font-size:10px;
  font-weight:700;
  z-index:3;
}

.profile-bottom{
  position:absolute;
  right:18px;
  bottom:18px;
  background:#111;
  color:#fff;
  padding:9px 13px;
  border-radius:4px;
  font-size:10px;
  font-weight:700;
  z-index:3;
}

.orbit{
  position:absolute;
  width:125px;
  height:125px;
  border:1px solid #111;
  border-radius:50%;
  left:-55px;
  bottom:-45px;
  background:var(--bg);
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  font-size:9px;
  font-weight:700;
  line-height:1.5;
  z-index:5;
}

.orbit:before{
  content:"✦";
  position:absolute;
  top:-9px;
  left:50%;
  transform:translateX(-50%);
  background:var(--bg);
  padding:0 5px;
}

@media(max-width:900px){
  .hero{
    padding:130px 18px 90px;
  }

  .hero-inner{
    grid-template-columns:1fr;
    gap:60px;
  }

  .hero-profile{
    margin:auto;
    max-width:420px;
  }
}

@media(max-width:600px){
  .hero-title{
    font-size:18vw;
  }

  .hero-description{
    font-size:15px;
  }

  .orbit{
    width:95px;
    height:95px;
    left:-10px;
    bottom:-30px;
  }
}

/* =====================================
   MARQUEE
===================================== */

.marquee{
  margin:0 14px;
  background:#111;
  color:#fff;
  overflow:hidden;
  border-radius:24px;
  padding:19px 0;
  white-space:nowrap;
}

.marquee-track{
  display:inline-flex;
  gap:40px;
  animation:marquee 25s linear infinite;
  font-size:12px;
  letter-spacing:.23em;
  font-weight:700;
}

@keyframes marquee{
  to{
    transform:translateX(-50%);
  }
}

/* =====================================
   SECTIONS
===================================== */

.section{
  max-width:1400px;
  margin:auto;
  padding:130px 32px;
}

.section-label{
  font-size:11px;
  text-transform:uppercase;
  letter-spacing:.3em;
  font-weight:700;
  color:var(--muted);
}

.section-heading{
  margin-top:10px;
  font-size:clamp(52px,7vw,100px);
  line-height:.9;
  letter-spacing:-.065em;
}

/* =====================================
   WORK
===================================== */

.work-head{
  display:flex;
  justify-content:space-between;
  align-items:end;
  margin-bottom:55px;
}

.work-head-text{
  max-width:370px;
  color:var(--muted);
  font-size:14px;
  line-height:1.7;
}

.filters{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-bottom:30px;
}

.filter{
  border:1px solid var(--line);
  background:transparent;
  border-radius:999px;
  padding:9px 15px;
  font-size:11px;
  font-weight:700;
}

.filter.active,
.filter:hover{
  background:#111;
  color:#fff;
}

.project-grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:18px;
}

.project-card{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:var(--cardRadius);
  overflow:hidden;
  transition:
    transform .45s cubic-bezier(.2,.8,.2,1),
    box-shadow .45s;
  cursor:pointer;
}

.project-card:hover{
  transform:translateY(-8px);
  box-shadow:0 25px 60px rgba(0,0,0,.13);
}

.project-image{
  width:100%;
  aspect-ratio:16/10;
  object-fit:cover;
  display:block;
  transition:transform .7s;
}

.project-card:hover .project-image{
  transform:scale(1.04);
}

.project-info{
  padding:22px 23px 25px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
}

.project-title{
  font-family:'Space Grotesk';
  font-weight:700;
  font-size:19px;
}

.project-tag{
  margin-top:5px;
  font-size:10px;
  color:var(--muted);
  letter-spacing:.15em;
  font-weight:700;
}

.project-arrow{
  width:42px;
  height:42px;
  border-radius:50%;
  background:#111;
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  flex:none;
}

@media(max-width:700px){
  .section{
    padding:90px 18px;
  }

  .work-head{
    display:block;
  }

  .work-head-text{
    margin-top:20px;
  }

  .project-grid{
    grid-template-columns:1fr;
  }
}

/* =====================================
   SERVICES
===================================== */

.services-section{
  background:#111;
  color:#fff;
}

.services-inner{
  max-width:1400px;
  margin:auto;
  padding:130px 32px;
}

.services-section .section-label{
  color:#777;
}

.services-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:14px;
  margin-top:60px;
}

.service{
  border:1px solid rgba(255,255,255,.1);
  background:rgba(255,255,255,.035);
  border-radius:var(--cardRadius);
  padding:30px;
  min-height:350px;
  transition:.4s;
}

.service:hover{
  background:rgba(255,255,255,.08);
  transform:translateY(-6px);
}

.service-number{
  color:#777;
  font-size:12px;
}

.service h3{
  font-size:29px;
  line-height:1;
  margin-top:100px;
}

.service p{
  color:#888;
  margin-top:20px;
  line-height:1.7;
  font-size:14px;
}

@media(max-width:800px){
  .services-inner{
    padding:90px 18px;
  }

  .services-grid{
    grid-template-columns:1fr;
  }

  .service{
    min-height:280px;
  }

  .service h3{
    margin-top:65px;
  }
}

/* =====================================
   ABOUT
===================================== */

.about-grid{
  display:grid;
  grid-template-columns:.8fr 1.2fr;
  gap:90px;
  align-items:center;
}

.big-zr{
  font-family:'Space Grotesk';
  font-size:clamp(100px,15vw,220px);
  font-weight:700;
  line-height:.7;
  letter-spacing:-.1em;
}

.about-title{
  font-size:clamp(42px,5.5vw,78px);
  line-height:.95;
  letter-spacing:-.055em;
}

.about-text{
  max-width:650px;
  margin-top:28px;
  color:var(--muted);
  font-size:16px;
  line-height:1.8;
}

.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:25px;
  margin-top:45px;
  border-top:1px solid var(--line);
  padding-top:27px;
}

.stat-number{
  font-family:'Space Grotesk';
  font-size:43px;
  font-weight:700;
}

.stat-label{
  color:var(--muted);
  font-size:10px;
  text-transform:uppercase;
  letter-spacing:.15em;
  margin-top:7px;
}

@media(max-width:800px){
  .about-grid{
    grid-template-columns:1fr;
    gap:50px;
  }

  .stats{
    grid-template-columns:1fr 1fr;
  }
}

/* =====================================
   CONTACT
===================================== */

.contact-section{
  background:var(--surface2);
}

.contact-inner{
  max-width:1400px;
  margin:auto;
  padding:130px 32px;
}

.contact-grid{
  display:grid;
  grid-template-columns:.8fr 1.2fr;
  gap:90px;
}

.contact-title{
  font-size:clamp(50px,7vw,100px);
  line-height:.85;
  letter-spacing:-.07em;
}

.contact-copy{
  color:var(--muted);
  margin-top:30px;
  line-height:1.7;
}

.contact-email{
  display:inline-block;
  margin-top:25px;
  font-weight:700;
  border-bottom:1px solid #111;
}

.contact-form{
  display:grid;
  gap:12px;
}

.field{
  width:100%;
  border:1px solid rgba(0,0,0,.14);
  background:rgba(255,255,255,.28);
  padding:18px;
  border-radius:16px;
  outline:none;
  color:#111;
}

.field:focus{
  border-color:#111;
  background:#fff;
}

textarea.field{
  resize:vertical;
  min-height:170px;
}

.submit{
  border:0;
  background:#111;
  color:#fff;
  padding:18px;
  border-radius:var(--buttonRadius);
  font-weight:700;
  text-align:left;
}

@media(max-width:800px){
  .contact-inner{
    padding:90px 18px;
  }

  .contact-grid{
    grid-template-columns:1fr;
    gap:50px;
  }
}

/* =====================================
   FOOTER
===================================== */

.footer{
  background:#111;
  color:#fff;
  padding:45px 32px;
}

.footer-inner{
  max-width:1400px;
  margin:auto;
  display:flex;
  justify-content:space-between;
  gap:20px;
  align-items:center;
}

.footer-logo{
  font-family:'Space Grotesk';
  font-weight:700;
}

.footer-muted{
  color:#666;
  font-size:11px;
}

@media(max-width:600px){
  .footer{
    padding:35px 18px;
  }

  .footer-inner{
    flex-direction:column;
    align-items:flex-start;
  }
}

/* =====================================
   REVEAL
===================================== */

.reveal{
  opacity:0;
  transform:translateY(30px);
  transition:.8s ease;
}

.reveal.visible{
  opacity:1;
  transform:none;
}

/* =====================================
   PREVIEW
===================================== */

.overlay{
  position:fixed;
  inset:0;
  z-index:5000;
  background:rgba(0,0,0,.92);
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.overlay.show{
  display:flex;
}

.preview-box{
  width:min(1100px,100%);
  max-height:94vh;
  overflow:auto;
}

.preview-close{
  float:right;
  width:44px;
  height:44px;
  border:0;
  border-radius:50%;
  background:#fff;
  color:#111;
  font-weight:700;
  margin-bottom:12px;
}

.preview-image{
  width:100%;
  max-height:80vh;
  object-fit:contain;
  border-radius:20px;
  display:block;
  clear:both;
}

.preview-name{
  color:#fff;
  font-family:'Space Grotesk';
  font-size:22px;
  font-weight:700;
  margin-top:15px;
}

/* =====================================
   LOGIN
===================================== */

.login-overlay{
  position:fixed;
  inset:0;
  z-index:8000;
  background:rgba(0,0,0,.88);
  backdrop-filter:blur(15px);
  display:none;
  align-items:center;
  justify-content:center;
  padding:18px;
}

.login-overlay.show{
  display:flex;
}

.login-box{
  width:min(430px,100%);
  background:#111;
  color:#fff;
  border:1px solid rgba(255,255,255,.1);
  border-radius:30px;
  padding:35px;
  box-shadow:0 30px 100px rgba(0,0,0,.4);
}

.login-top{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.login-close{
  border:0;
  background:rgba(255,255,255,.08);
  color:#fff;
  width:38px;
  height:38px;
  border-radius:50%;
}

.login-small{
  color:#666;
  font-size:10px;
  letter-spacing:.25em;
  text-transform:uppercase;
  margin-top:30px;
}

.login-title{
  font-size:38px;
  margin-top:6px;
}

.login-field{
  width:100%;
  padding:15px;
  margin-top:12px;
  background:#fff;
  color:#111;
  border:0;
  outline:none;
  border-radius:13px;
}

.login-button{
  width:100%;
  border:0;
  margin-top:15px;
  padding:16px;
  background:#fff;
  color:#111;
  border-radius:13px;
  font-weight:700;
}

.login-error{
  color:#ff7070;
  font-size:11px;
  margin-top:10px;
  display:none;
}

.login-hint{
  color:#555;
  font-size:10px;
  line-height:1.6;
  margin-top:18px;
}

/* =====================================
   ADMIN
===================================== */

.admin-overlay{
  position:fixed;
  inset:0;
  z-index:9000;
  background:#0c0c0c;
  color:#fff;
  display:none;
  overflow-y:auto;
}

.admin-overlay.show{
  display:block;
}

.admin-shell{
  max-width:1500px;
  margin:auto;
  min-height:100vh;
}

.admin-header{
  position:sticky;
  top:0;
  z-index:20;
  background:rgba(12,12,12,.9);
  backdrop-filter:blur(18px);
  border-bottom:1px solid rgba(255,255,255,.08);
  padding:20px 30px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:20px;
}

.admin-brand{
  display:flex;
  align-items:center;
  gap:13px;
}

.admin-mark{
  width:43px;
  height:43px;
  border-radius:14px;
  background:#fff;
  color:#111;
  display:flex;
  align-items:center;
  justify-content:center;
  font-family:'Space Grotesk';
  font-weight:700;
}

.admin-brand-title{
  font-family:'Space Grotesk';
  font-weight:700;
}

.admin-brand-sub{
  font-size:9px;
  color:#666;
  letter-spacing:.15em;
  margin-top:2px;
}

.admin-actions{
  display:flex;
  gap:8px;
}

.admin-btn{
  border:1px solid rgba(255,255,255,.13);
  background:rgba(255,255,255,.05);
  color:#fff;
  border-radius:999px;
  padding:10px 16px;
  font-size:11px;
  font-weight:700;
}

.admin-btn:hover{
  background:#fff;
  color:#111;
}

.admin-btn.danger:hover{
  background:#d95353;
  color:#fff;
}

.admin-body{
  padding:30px;
}

.admin-welcome{
  padding:45px;
  border:1px solid rgba(255,255,255,.08);
  border-radius:30px;
  background:
    radial-gradient(circle at 80% 20%,rgba(255,255,255,.08),transparent 35%),
    linear-gradient(135deg,#161616,#0e0e0e);
  margin-bottom:20px;
  position:relative;
  overflow:hidden;
}

.admin-welcome:after{
  content:"ZR";
  position:absolute;
  right:30px;
  bottom:-70px;
  font-family:'Space Grotesk';
  font-size:220px;
  line-height:1;
  color:rgba(255,255,255,.025);
  font-weight:700;
}

.admin-eyebrow{
  color:#666;
  font-size:10px;
  letter-spacing:.3em;
  text-transform:uppercase;
}

.admin-welcome h2{
  font-size:clamp(40px,6vw,78px);
  line-height:.9;
  margin-top:12px;
  letter-spacing:-.06em;
  position:relative;
  z-index:2;
}

.admin-welcome p{
  color:#777;
  max-width:600px;
  line-height:1.7;
  margin-top:20px;
  position:relative;
  z-index:2;
}

.admin-tabs{
  display:flex;
  flex-wrap:wrap;
  gap:7px;
  margin:20px 0;
  position:sticky;
  top:84px;
  z-index:15;
  background:#0c0c0c;
  padding:8px 0;
}

.admin-tab{
  border:1px solid rgba(255,255,255,.1);
  background:#111;
  color:#888;
  padding:11px 16px;
  border-radius:999px;
  font-size:10px;
  font-weight:700;
}

.admin-tab.active,
.admin-tab:hover{
  background:#fff;
  color:#111;
}

.admin-panel{
  display:none;
}

.admin-panel.active{
  display:block;
}

.control-grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:18px;
}

.control-card{
  background:#111;
  border:1px solid rgba(255,255,255,.08);
  border-radius:26px;
  padding:25px;
}

.control-card.full{
  grid-column:1/-1;
}

.control-title{
  font-family:'Space Grotesk';
  font-size:21px;
  font-weight:700;
}

.control-sub{
  color:#666;
  font-size:11px;
  margin-top:5px;
  margin-bottom:20px;
}

.admin-label{
  display:block;
  color:#888;
  font-size:10px;
  text-transform:uppercase;
  letter-spacing:.13em;
  font-weight:700;
  margin:15px 0 7px;
}

.admin-input,
.admin-textarea,
.admin-select{
  width:100%;
  background:#191919;
  border:1px solid #2b2b2b;
  color:#fff;
  outline:none;
  padding:13px 14px;
  border-radius:13px;
}
